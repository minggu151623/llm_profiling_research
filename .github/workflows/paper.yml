name: Check paper sources
on:
  push:
    branches: [research/empirical-study, main]
    paths: ['paper/**', 'research/literature/papers.bib', 'scripts/check_paper.py', '.github/workflows/paper.yml']
  pull_request:
    paths: ['paper/**', 'research/literature/papers.bib', 'scripts/check_paper.py', '.github/workflows/paper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: python scripts/check_paper.py
