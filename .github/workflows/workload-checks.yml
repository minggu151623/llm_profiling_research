name: Replay workload seeds and Java 25 compatibility
on:
  push:
    branches: [research/empirical-study]
    paths: ['.github/workflows/workload-checks.yml', 'scripts/dacapo_java25.py', 'scripts/seed_sensitivity.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install pinned Java toolchain
        working-directory: ${{ runner.temp }}
        run: |
          curl -fLsS --retry 3 -o jdk.tgz 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5.1%2B2/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5.1_2.tar.gz'
          echo '760f91b22c3efc9bd1b64ff950598231be82928cc807e30691a0e7a2995a62c0  jdk.tgz' | sha256sum -c -
          mkdir study-jdk; tar xzf jdk.tgz --strip-components=1 -C study-jdk
          curl -fLsS --retry 3 -o mvn.tgz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz
          echo 'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  mvn.tgz' | sha512sum -c -
          tar xzf mvn.tgz
          echo "JAVA_HOME=$RUNNER_TEMP/study-jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/study-jdk/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: Reproduce traces for the four additional seeds
        run: |
          for seed in 1517 1518 1519 1520; do
            python scripts/corpus.py "$RUNNER_TEMP/extra/$seed" --seed "$seed"
          done
          python scripts/seed_sensitivity.py "$RUNNER_TEMP/extra" results/seeds
      - name: Run the unmodified legacy workloads on Temurin 25
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dacapo.jar" https://github.com/dacapobench/dacapobench/releases/download/v9.12-MR1-bach/dacapo-9.12-MR1-bach.jar
          python scripts/dacapo_java25.py "$RUNNER_TEMP/dacapo.jar" "$JAVA_HOME/bin/java" results/java25.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workload-checks
          path: results/
