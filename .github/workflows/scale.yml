name: Exploratory 1.5B model run
on:
  push:
    branches: [research/empirical-study]
    paths: ['ml/slm/scale.py', 'ml/scale.py', '.github/workflows/scale.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Infer with the pinned 1.5B checkpoint on the registered static inputs
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m venv "$RUNNER_TEMP/slm"
          "$RUNNER_TEMP/slm/bin/pip" install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/slm/bin/pip" install -r ml/slm/requirements.txt
          "$RUNNER_TEMP/slm/bin/python" ml/slm/scale.py experiments/study/corpus result/slm-1.5b --device cpu --threads 4 --batch-size 8
          lscpu > result/cpu.txt
      - name: Score with the registered folds
        run: |
          python -m pip install -r ml/requirements.txt
          cd ml && python scale.py ../experiments/study/corpus ../result/slm-1.5b ../experiments/study/evaluation ../result/supplement
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scale-1.5b
          path: result/
