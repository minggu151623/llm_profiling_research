name: Verify and score branch study
on:
  push:
    branches: [research/empirical-study]
    paths: ['ml/*.py', 'ml/requirements.txt', 'scripts/verify_study.py', 'experiments/study/slm/**', '.github/workflows/score.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m unittest discover -s data/tests -v && python -m unittest discover -s ml -p test_study.py -v
      - run: python ml/evaluate.py experiments/study/corpus experiments/study/slm result/evaluation
      - run: python scripts/verify_study.py experiments/study/corpus experiments/study/slm result/evaluation
      - run: python ml/figures.py result/evaluation result/project-results.png
      - run: python ml/sensitivity.py result/evaluation/predictions.csv result/supplement
      - run: python ml/centered.py experiments/study/corpus experiments/study/slm result/supplement
      - run: python ml/rmse.py result/evaluation/predictions.csv result/supplement
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-scores
          path: result/
